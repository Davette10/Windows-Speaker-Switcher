name: Build SpeakerSwitcher.exe

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build single-file exe
        run: >
          dotnet publish SpeakerSwitcher/SpeakerSwitcher.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -o publish

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: SpeakerSwitcher
          path: publish/SpeakerSwitcher.exe

      - name: Attach exe to the GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/SpeakerSwitcher.exe
          body: |
            Download **SpeakerSwitcher.exe** below, double-click it, pick your speakers, and press **Alt + A** to switch.
            No install needed. If Windows shows "Windows protected your PC", click **More info → Run anyway**.
